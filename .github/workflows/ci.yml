name: CI

on:
push:
branches: [ "mvp", "main" ]
pull_request:
branches: [ "mvp", "main" ]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Cache Maven dependencies
    uses: actions/cache@v4
    with:
      path: ~/.m2
      key: maven-${{ hashFiles('**/pom.xml') }}

  - name: Run unit tests
    run: mvn test

  - name: Build project
    run: mvn clean package -DskipTests

  - name: Build Docker image
    run: docker build -t emergency-alert:latest .
