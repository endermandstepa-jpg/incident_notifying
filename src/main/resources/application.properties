# Application
spring.application.name=emergency-alert

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/emergency_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security
security.api-key=${API_KEY:your-secret-api-key-here}

# Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN:your-telegram-bot-token}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:your-bot-username}

# Logging
logging.level.com.emergency.alert=DEBUG
logging.level.org.springframework.security=DEBUG